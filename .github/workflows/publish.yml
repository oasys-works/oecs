name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # jsr publish shells to `deno publish --unstable-byonm`, which resolves
      # bare imports (e.g. solid-js in ./solid) from a physical node_modules,
      # so deps must be installed before publishing.
      - run: pnpm install --frozen-lockfile
      - name: Publish to JSR
        run: npx jsr publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
